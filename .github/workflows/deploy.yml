name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  PROJECT_ID: video-genius-prod-v1
  SERVICE_NAME: video-genius-api
  REGION: us-central1
  IMAGE_NAME: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build and push Docker image
        run: |
          # Get commit SHA for versioning
          COMMIT_SHA=$(git rev-parse HEAD)
          IMAGE_TAG="${{ env.IMAGE_NAME }}:${COMMIT_SHA}"

          # Build image
          docker build -t "${IMAGE_TAG}" -t "${{ env.IMAGE_NAME }}:latest" .

          # Push images
          docker push "${IMAGE_TAG}"
          docker push "${{ env.IMAGE_NAME }}:latest"

          # Export image tag for next step
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Setup secrets
        run: |
          # Check if JWT secret exists, create if not
          if ! gcloud secrets describe jwt-secret-key --project=${{ env.PROJECT_ID }} &>/dev/null; then
            echo "Creating JWT secret key..."
            openssl rand -base64 32 | gcloud secrets create jwt-secret-key --project=${{ env.PROJECT_ID }} --data-file=-
          fi

          # Check if YouTube API key secret exists
          if ! gcloud secrets describe youtube-api-key --project=${{ env.PROJECT_ID }} &>/dev/null; then
            echo "YouTube API key secret not found. Please create it manually or add to secrets."
            exit 1
          fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --image=${{ env.IMAGE_TAG }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=2Gi \
            --cpu=2 \
            --max-instances=10 \
            --concurrency=80 \
            --timeout=900 \
            --set-env-vars="ENV=production,GCP_PROJECT_ID=${{ env.PROJECT_ID }},USE_SECRET_MANAGER=true,SECRET_MANAGER_PROJECT_ID=${{ env.PROJECT_ID }},LOG_LEVEL=INFO" \
            --set-secrets="JWT_SECRET_KEY=jwt-secret-key:latest,YOUTUBE_API_KEY=youtube-api-key:latest"

      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --project=${{ env.PROJECT_ID }} --region=${{ env.REGION }} --format="value(status.url)")
          echo "SERVICE_URL=${SERVICE_URL}" >> $GITHUB_ENV
          echo "🚀 Deploy completed! Service URL: ${SERVICE_URL}"

      - name: Health check
        run: |
          echo "Running health check..."
          sleep 15

          if curl -f -s "${{ env.SERVICE_URL }}/health" > /dev/null; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed"
            exit 1
          fi

      - name: Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 **Deploy Successful!**\n\n- **Service URL:** ${{ env.SERVICE_URL }}\n- **API Docs:** ${{ env.SERVICE_URL }}/docs\n- **Health Check:** ${{ env.SERVICE_URL }}/health\n- **Environment:** Production`
            })
